[package]
name = "restore-go-live"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "rgl"
path = "src/lib.rs"

[[bin]]
name = "restore-go-live"
path = "src/main.rs"

[[bin]]
name = "restore-go-live-daemon"
path = "src/daemon_main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
notify = "8.2.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40.4"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
