[package]
name = "restore-go-live"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "rgl"
path = "src/lib.rs"

[[bin]]
name = "restore-go-live"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
