name: Build and release

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone Vencord and link plugin
        run: node scripts/setup.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Package release
        run: node scripts/package-release.mjs

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            --title "RestoreGoLive (latest)" \
            --notes "Automatic build of \`main\` (${{ github.sha }}).

          Windows:
          \`\`\`powershell
          irm https://doce.sh/restore-go-live/install.ps1 | iex
          \`\`\`

          macOS / Linux:
          \`\`\`sh
          curl -fsSL https://doce.sh/restore-go-live/install.sh | bash
          \`\`\`" \
            release/*
